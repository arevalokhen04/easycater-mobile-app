<ion-app>
  <ion-split-pane contentId="admin-content" when="lg">
    <ion-menu contentId="admin-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>
            <span class="brand-inline">
              <img src="assets/easycater-mark-white.png" alt="" />
              EasyCater Admin
            </span>
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="none">
          <ion-list-header>Manage</ion-list-header>

          @for (link of links; track link.path) {
            <ion-item
              button
              [routerLink]="link.path"
              routerLinkActive="selected"
              [routerLinkActiveOptions]="{ exact: false }"
              (click)="close()"
            >
              <ion-icon slot="start" [name]="link.icon"></ion-icon>
              <ion-label>{{ link.label }}</ion-label>
            </ion-item>
          }
        </ion-list>
      </ion-content>

      <ion-footer>
        <ion-toolbar>
          <div class="who">
            <ion-avatar class="avatar">
              <ion-icon name="person"></ion-icon>
            </ion-avatar>
            <div class="who-text">
              <strong>{{ adminName }}</strong>
              <span>Administrator</span>
            </div>
          </div>
        </ion-toolbar>
        <ion-toolbar>
          <ion-button expand="block" fill="clear" color="medium" (click)="auth.logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Log out
          </ion-button>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>

    <ion-tabs id="admin-content">
      <!-- NOTE: ion-tabs creates its own internal ion-router-outlet inside
           .tabs-inner - adding an explicit one stacks an EMPTY outlet on top
           of the pages, which swallows every tap on page content (the exact
           "only the bottom tabs respond" bug). Keep this slot empty. -->

      <!-- Bottom tab navigation on phones/tablets; the desktop keeps the
           sidenav (this bar hides at the lg breakpoint). -->
      <ion-tab-bar slot="bottom">
        @for (link of tabLinks; track link.path) {
          <ion-tab-button [routerLink]="link.path" routerLinkActive="tab-selected">
            <ion-icon [name]="link.icon"></ion-icon>
            <ion-label>{{ link.label }}</ion-label>
          </ion-tab-button>
        }
      </ion-tab-bar>
    </ion-tabs>
  </ion-split-pane>
</ion-app>
