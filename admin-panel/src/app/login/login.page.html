<ion-content class="ion-no-padding">
  <div class="wrap">
    <div class="side">
      <div class="side-inner">
        <div class="logo">
          <ion-icon name="restaurant"></ion-icon>
        </div>
        <h1>EasyCater Admin</h1>
        <p>Manage packages, menus, bookings, payments and reports from one place.</p>
      </div>
    </div>

    <div class="form-side">
      <form class="form" (ngSubmit)="submit()">
        <h2>Sign in</h2>
        <p class="sub">Use your administrator account to continue.</p>

        @if (error(); as message) {
          <div class="error">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>{{ message }}</span>
          </div>
        }

        <ion-item class="ec-field" lines="none">
          <ion-label position="stacked">Email</ion-label>
          <ion-input
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="admin@easycater.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
          ></ion-input>
        </ion-item>

        <ion-item class="ec-field" lines="none">
          <ion-label position="stacked">Password</ion-label>
          <ion-input
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Your password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
          ></ion-input>
          <ion-button
            fill="clear"
            slot="end"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <ion-icon slot="icon-only" [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>

        <ion-button class="ec-btn block" expand="block" type="submit" [disabled]="busy()">
          {{ busy() ? 'Signing in...' : 'Sign In' }}
        </ion-button>

        <ion-button fill="clear" size="small" type="button" (click)="fillDemo()">
          Use demo credentials
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
