<ion-tabs>
  <ion-tab-bar slot="bottom" [translucent]="true">
    <ion-tab-button routerLink="/tabs/home" routerLinkActive="tab-selected">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/tabs/packages" routerLinkActive="tab-selected">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Packages</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/tabs/menu" routerLinkActive="tab-selected">
      <ion-icon name="restaurant-outline"></ion-icon>
      <ion-label>Menu</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/tabs/bookings" routerLinkActive="tab-selected">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Bookings</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/tabs/profile" routerLinkActive="tab-selected">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
