<span class="stars" role="img" [attr.aria-label]="'Rated ' + (rating() | number: '1.1-1') + ' out of 5'">
  @for (icon of stars(); track $index) {
    <ion-icon [name]="icon" aria-hidden="true"></ion-icon>
  }
  @if (showValue()) {
    <span class="value">{{ rating() | number: '1.1-1' }}</span>
  }
</span>
